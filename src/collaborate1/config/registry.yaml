# collaborate1 패키지 파일명 / 노드 / 경로 통합 관리 파일
# 이 파일을 수정한 뒤 `colcon build --packages-select collaborate1 --symlink-install`을 실행하면
# setup.py의 console_scripts 엔트리포인트가 자동으로 반영됩니다.

paths:
  stick_slot: "~/.ros/stick_slot.json"
  pen_slots: "~/.ros/pen_slots.json"
  plane_calibration: "~/.ros/plane_calibration.json"
  run_logs: "/home/qownsdud/ws_cobot_pjt/ws_dsr/run_logs"
  svg_sample: "collaborate1/core/sample_drawing.svg"

nodes:
  setup_tools:
    manual_move:
      entry: "collaborate1.setup_tools.manual_move:main"
      desc: "PC 키보드 수동 조종 (조그, 그리퍼, 좌표/외력 조회)"
    calibrate_plane:
      entry: "collaborate1.setup_tools.calibrate_plane:main"
      desc: "9점 바닥 기울기 보정 및 평탄도 측정"
    teach_stick_slot:
      entry: "collaborate1.setup_tools.teach_stick_slot:main"
      desc: "기준 막대 잡는 위치 티칭 및 저장"
    teach_pen_slots:
      entry: "collaborate1.setup_tools.teach_pen_slots:main"
      desc: "펜 3개 잡는 위치 티칭 및 저장"

  app:
    draw_multi_pen:
      entry: "collaborate1.app.draw_multi_pen:main"
      desc: "1~14단계 통합 멀티펜 드로잉 (막대 높이 측정 -> 펜1·2·3 그리기)"
    pen_pick_place:
      entry: "collaborate1.app.pen_pick_place:main"
      desc: "저장된 3개 펜 자동 집기 -> 홈 -> 원위치"
    draw_cursive:
      entry: "collaborate1.app.draw_cursive:main"
      desc: "모든 알파벳(A-Z, a-z) 3D 두께 변화 필기체 그리기"
    draw_routes:
      entry: "collaborate1.app.draw_routes:main"
      desc: "복합 다중 루트(사인파, 지그재그, 나선, 별) 그리기"

  experiments:
    draw1:
      entry: "collaborate1.experiments.draw1:main"
      desc: "측면 막대 외력 접촉 기반 펜 높이 조절 및 직선 테스트"
    drawingtest_force:
      entry: "collaborate1.experiments.drawingtest_force:main"
      desc: "초기 순응·힘 제어 기반 SVG/도형 그리기 테스트"
    drawingtest_slow:
      entry: "collaborate1.experiments.drawingtest_slow:main"
      desc: "저속 단계적 위치 제어 기반 안전 접촉 탐색 테스트"
    grip_test:
      entry: "collaborate1.experiments.grip_text:main"
      desc: "그리퍼 DO 1/2번 핀 개폐 테스트"
    force_test:
      entry: "collaborate1.experiments.force_test:main"
      desc: "툴 외력(Fz) 조회 단위 테스트"
    pendant_force_monitor:
      entry: "collaborate1.experiments.pendant_force_monitor:main"
      desc: "펜던트 수동 조작 중 외력 모니터링"
    draw_line:
      entry: "collaborate1.experiments.draw_line:main"
      desc: "직선 긋기 단위 테스트"
    move_test:
      entry: "collaborate1.experiments.move_test:main"
      desc: "기본 이동 단위 테스트"
    draw_square:
      entry: "collaborate1.experiments.draw_square:main"
      desc: "정사각형 그리기 단위 테스트"
    draw_path:
      entry: "collaborate1.experiments.draw_path:main"
      desc: "다중 좌표 경로 그리기 단위 테스트"
    force_control_test:
      entry: "collaborate1.experiments.force_control_test:main"
      desc: "힘 제어 단위 테스트"
    force_compare:
      entry: "collaborate1.experiments.force_compare:main"
      desc: "힘 센서 비교 단위 테스트"
